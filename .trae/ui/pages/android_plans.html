<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy - 我的计划</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="h-screen overflow-hidden bg-[#f6f7f8] font-sans text-[#171b1a]">
  <main class="mx-auto flex h-full max-w-md flex-col">
    <header class="flex h-16 shrink-0 items-center justify-between px-5">
      <div>
        <h1 class="text-2xl font-bold">我的计划</h1>
        <p class="text-xs text-[#69716e]">3 组计划</p>
      </div>
      <button class="flex h-11 w-11 items-center justify-center rounded-full bg-[#176b5a] text-white" aria-label="新建计划">
        <i class="fa-solid fa-plus text-lg"></i>
      </button>
    </header>

    <section class="min-h-0 flex-1 space-y-3 overflow-y-auto px-4 pb-5 pt-2">
      <article class="rounded-lg border border-[#dfe5e2] bg-white p-4">
        <div class="flex items-start justify-between">
          <div><h2 class="font-bold">工作日（不含周二）</h2><p class="mt-1 text-sm text-[#69716e]">周一、周三至周五 · 10 项</p></div>
          <i class="fa-solid fa-chevron-right mt-1 text-xs text-[#9ba19f]"></i>
        </div>
        <div class="my-4 h-px bg-[#edf0ef]"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-sm font-semibold text-[#176b5a]"><i class="fa-solid fa-alarm-clock"></i><span>已启用</span></div>
          <div class="relative h-7 w-12 rounded-full bg-[#176b5a]"><span class="absolute right-1 top-1 h-5 w-5 rounded-full bg-white"></span></div>
        </div>
        <div class="mt-4 flex gap-6 text-sm font-semibold text-[#176b5a]">
          <button><i class="fa-solid fa-pen mr-2"></i>编辑</button>
          <button><i class="fa-regular fa-copy mr-2"></i>复制</button>
        </div>
      </article>

      <article class="rounded-lg border border-[#dfe5e2] bg-white p-4">
        <div class="flex items-start justify-between">
          <div><h2 class="font-bold">周二</h2><p class="mt-1 text-sm text-[#69716e]">每周二 · 5 项</p></div>
          <i class="fa-solid fa-chevron-right mt-1 text-xs text-[#9ba19f]"></i>
        </div>
        <div class="my-4 h-px bg-[#edf0ef]"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-sm font-medium text-[#737b78]"><i class="fa-regular fa-clock"></i><span>未启用</span></div>
          <div class="relative h-7 w-12 rounded-full bg-[#cbd0ce]"><span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white"></span></div>
        </div>
        <div class="mt-4 flex gap-6 text-sm font-semibold text-[#176b5a]">
          <button><i class="fa-solid fa-pen mr-2"></i>编辑</button>
          <button><i class="fa-regular fa-copy mr-2"></i>复制</button>
        </div>
      </article>

      <article class="rounded-lg border border-[#dfe5e2] bg-white p-4">
        <div class="flex items-start justify-between">
          <div><h2 class="font-bold">周末</h2><p class="mt-1 text-sm text-[#69716e]">周六、周日 · 7 项</p></div>
          <i class="fa-solid fa-chevron-right mt-1 text-xs text-[#9ba19f]"></i>
        </div>
        <div class="my-4 h-px bg-[#edf0ef]"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-sm font-medium text-[#737b78]"><i class="fa-regular fa-clock"></i><span>未启用</span></div>
          <div class="relative h-7 w-12 rounded-full bg-[#cbd0ce]"><span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white"></span></div>
        </div>
        <div class="mt-4 flex gap-6 text-sm font-semibold text-[#176b5a]">
          <button><i class="fa-solid fa-pen mr-2"></i>编辑</button>
          <button><i class="fa-regular fa-copy mr-2"></i>复制</button>
        </div>
      </article>

      <p class="px-2 py-2 text-xs leading-5 text-[#69716e]">启用成功后由 Android 系统管理闹钟，无需保持 App 打开。</p>
    </section>

    <nav class="grid h-20 shrink-0 grid-cols-2 border-t border-[#dfe3e1] bg-white px-7">
      <a href="#" class="flex flex-col items-center justify-center gap-1 text-[#656d6a]"><i class="fa-regular fa-calendar text-xl"></i><span class="text-xs font-semibold">今天</span></a>
      <a href="#" class="flex flex-col items-center justify-center gap-1 text-[#176b5a]"><i class="fa-solid fa-table-cells-large text-xl"></i><span class="text-xs font-semibold">计划</span></a>
    </nav>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy - 平板双栏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="h-screen overflow-hidden bg-[#f6f7f8] font-sans text-[#171b1a]">
  <main class="grid h-full grid-cols-[76px_280px_1fr]">
    <nav class="flex flex-col items-center border-r border-[#dfe4e1] bg-white py-5">
      <div class="mb-8 flex h-11 w-11 items-center justify-center rounded-lg bg-[#176b5a] text-xl font-black text-white">S</div>
      <a href="#" class="mb-3 flex h-14 w-14 flex-col items-center justify-center gap-1 rounded-lg bg-[#e4f1ed] text-[#176b5a]"><i class="fa-solid fa-calendar-day"></i><span class="text-[10px] font-bold">今天</span></a>
      <a href="#" class="flex h-14 w-14 flex-col items-center justify-center gap-1 text-[#68706d]"><i class="fa-solid fa-table-cells-large"></i><span class="text-[10px] font-bold">计划</span></a>
      <button class="mt-auto flex h-11 w-11 items-center justify-center rounded-full bg-[#176b5a] text-white" aria-label="新建计划"><i class="fa-solid fa-plus"></i></button>
    </nav>

    <aside class="border-r border-[#dfe4e1] bg-[#f0f3f2] p-4">
      <div class="mb-4 flex items-center justify-between"><div><h1 class="text-xl font-bold">我的计划</h1><p class="text-xs text-[#69716e]">3 组</p></div><i class="fa-solid fa-rotate text-[#69716e]"></i></div>
      <div class="space-y-2">
        <article class="rounded-lg border border-[#b7cec7] bg-white p-3 shadow-sm">
          <div class="flex items-start justify-between"><div><h2 class="text-sm font-bold">工作日（不含周二）</h2><p class="mt-1 text-xs text-[#69716e]">10 项提醒</p></div><span class="h-2.5 w-2.5 rounded-full bg-[#176b5a]"></span></div>
          <div class="mt-3 flex items-center justify-between text-xs"><span class="font-semibold text-[#176b5a]"><i class="fa-solid fa-alarm-clock mr-1"></i>已启用</span><i class="fa-solid fa-chevron-right text-[#939a97]"></i></div>
        </article>
        <article class="rounded-lg border border-[#dfe4e1] bg-white p-3">
          <div class="flex items-start justify-between"><div><h2 class="text-sm font-bold">周二</h2><p class="mt-1 text-xs text-[#69716e]">5 项提醒</p></div><span class="h-2.5 w-2.5 rounded-full bg-[#bdc3c0]"></span></div>
          <div class="mt-3 flex items-center justify-between text-xs text-[#69716e]"><span><i class="fa-regular fa-clock mr-1"></i>未启用</span><i class="fa-solid fa-chevron-right text-[#939a97]"></i></div>
        </article>
        <article class="rounded-lg border border-[#dfe4e1] bg-white p-3">
          <div class="flex items-start justify-between"><div><h2 class="text-sm font-bold">周末</h2><p class="mt-1 text-xs text-[#69716e]">7 项提醒</p></div><span class="h-2.5 w-2.5 rounded-full bg-[#bdc3c0]"></span></div>
          <div class="mt-3 flex items-center justify-between text-xs text-[#69716e]"><span><i class="fa-regular fa-clock mr-1"></i>未启用</span><i class="fa-solid fa-chevron-right text-[#939a97]"></i></div>
        </article>
      </div>
    </aside>

    <section class="min-w-0 overflow-y-auto px-7 py-6">
      <header class="mb-5 flex items-center justify-between"><h1 class="text-2xl font-bold">今日计划</h1><button class="h-10 w-10 text-[#626b68]" aria-label="使用说明"><i class="fa-regular fa-circle-question text-xl"></i></button></header>
      <div class="mb-6 flex items-center gap-4 rounded-lg border border-[#e0e5e2] bg-white p-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-[#fff3e5] text-[#e87920]"><i class="fa-solid fa-sun text-2xl"></i></div>
        <div><h2 class="text-xl font-bold">10月1日 星期四</h2><p class="mt-1 text-sm text-[#69716e]">今天有 4 项安排</p></div>
      </div>
      <h2 class="mb-3 text-sm font-bold">今日时间轴</h2>
      <div class="space-y-2">
        <article class="grid grid-cols-[54px_14px_1fr] gap-3"><time class="pt-3 text-right font-bold">16:20</time><div class="flex flex-col items-center"><span class="mt-4 h-2.5 w-2.5 rounded-full bg-[#9ba09e]"></span><span class="w-px flex-1 bg-[#d8dcda]"></span></div><div class="flex items-center gap-3 rounded-lg border border-[#e0e5e2] bg-white p-3"><i class="fa-solid fa-mug-hot w-6 text-center text-[#176b5a]"></i><div><h3 class="text-sm font-bold">休息</h3><p class="text-xs text-[#737b78]">工作日（不含周二）</p></div><span class="ml-auto rounded-full bg-[#f1f2f2] px-2 py-1 text-[10px] font-semibold text-[#777e7c]">未开始</span></div></article>
        <article class="grid grid-cols-[54px_14px_1fr] gap-3"><time class="pt-3 text-right font-bold">16:50</time><div class="flex flex-col items-center"><span class="mt-4 h-2.5 w-2.5 rounded-full bg-[#9ba09e]"></span><span class="w-px flex-1 bg-[#d8dcda]"></span></div><div class="flex items-center gap-3 rounded-lg border border-[#e0e5e2] bg-white p-3"><i class="fa-solid fa-book w-6 text-center text-[#176b5a]"></i><div><h3 class="text-sm font-bold">语文作业</h3><p class="text-xs text-[#737b78]">工作日（不含周二）</p></div><span class="ml-auto rounded-full bg-[#f1f2f2] px-2 py-1 text-[10px] font-semibold text-[#777e7c]">未开始</span></div></article>
        <article class="grid grid-cols-[54px_14px_1fr] gap-3"><time class="pt-3 text-right font-bold">18:20</time><div class="flex flex-col items-center"><span class="mt-4 h-2.5 w-2.5 rounded-full bg-[#9ba09e]"></span><span class="w-px flex-1 bg-[#d8dcda]"></span></div><div class="flex items-center gap-3 rounded-lg border border-[#e0e5e2] bg-white p-3"><i class="fa-solid fa-calculator w-6 text-center text-[#176b5a]"></i><div><h3 class="text-sm font-bold">数学作业</h3><p class="text-xs text-[#737b78]">工作日（不含周二）</p></div><span class="ml-auto rounded-full bg-[#f1f2f2] px-2 py-1 text-[10px] font-semibold text-[#777e7c]">未开始</span></div></article>
        <article class="grid grid-cols-[54px_14px_1fr] gap-3"><time class="pt-3 text-right font-bold">19:10</time><div class="flex flex-col items-center"><span class="mt-4 h-2.5 w-2.5 rounded-full bg-[#9ba09e]"></span></div><div class="flex items-center gap-3 rounded-lg border border-[#e0e5e2] bg-white p-3"><i class="fa-solid fa-language w-6 text-center text-[#176b5a]"></i><div><h3 class="text-sm font-bold">英语作业</h3><p class="text-xs text-[#737b78]">工作日（不含周二）</p></div><span class="ml-auto rounded-full bg-[#f1f2f2] px-2 py-1 text-[10px] font-semibold text-[#777e7c]">未开始</span></div></article>
      </div>
    </section>
  </main>
</body>
</html>

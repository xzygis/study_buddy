<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy - 编辑计划</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="h-screen overflow-hidden bg-[#f6f7f8] font-sans text-[#171b1a]">
  <main class="mx-auto flex h-full max-w-md flex-col">
    <header class="flex h-16 shrink-0 items-center justify-between border-b border-[#e0e4e2] bg-white px-3">
      <button class="flex h-11 w-11 items-center justify-center text-[#3e4744]" aria-label="返回"><i class="fa-solid fa-arrow-left text-lg"></i></button>
      <h1 class="text-lg font-bold">编辑计划</h1>
      <button class="h-11 px-3 font-bold text-[#176b5a]">保存</button>
    </header>

    <form class="min-h-0 flex-1 space-y-5 overflow-y-auto px-4 py-5">
      <section>
        <label class="mb-2 block text-sm font-bold">计划名称</label>
        <div class="rounded-lg border border-[#cdd4d1] bg-white px-4 py-3 text-base">工作日（不含周二）</div>
      </section>

      <section>
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-sm font-bold">整组重复</h2>
          <button type="button" class="flex items-center gap-2 text-sm font-semibold text-[#176b5a]">快捷选择<i class="fa-solid fa-chevron-down text-xs"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1.5">
          <button type="button" class="aspect-square rounded-lg bg-[#176b5a] text-sm font-bold text-white">一</button>
          <button type="button" class="aspect-square rounded-lg border border-[#cfd5d3] bg-white text-sm font-bold text-[#68706d]">二</button>
          <button type="button" class="aspect-square rounded-lg bg-[#176b5a] text-sm font-bold text-white">三</button>
          <button type="button" class="aspect-square rounded-lg bg-[#176b5a] text-sm font-bold text-white">四</button>
          <button type="button" class="aspect-square rounded-lg bg-[#176b5a] text-sm font-bold text-white">五</button>
          <button type="button" class="aspect-square rounded-lg border border-[#cfd5d3] bg-white text-sm font-bold text-[#68706d]">六</button>
          <button type="button" class="aspect-square rounded-lg border border-[#cfd5d3] bg-white text-sm font-bold text-[#68706d]">日</button>
        </div>
        <p class="mt-2 text-xs text-[#69716e]">周一、周三至周五重复，应用于下面所有提醒。</p>
      </section>

      <section>
        <div class="mb-3 flex items-center justify-between"><h2 class="text-sm font-bold">提醒事项</h2><span class="text-xs text-[#69716e]">3 项</span></div>
        <div class="space-y-2">
          <div class="rounded-lg border border-[#dfe5e2] bg-white p-4">
            <div class="flex items-center gap-3"><i class="fa-solid fa-book w-5 text-[#176b5a]"></i><span class="flex-1 font-semibold">语文作业</span><button type="button" class="h-9 w-9 text-[#727a77]" aria-label="删除提醒"><i class="fa-regular fa-trash-can"></i></button></div>
            <div class="mt-3 flex items-center justify-between border-t border-[#edf0ef] pt-3"><span class="text-sm text-[#69716e]">开始时间</span><time class="text-lg font-bold text-[#176b5a]">16:50</time></div>
          </div>
          <div class="rounded-lg border border-[#dfe5e2] bg-white p-4">
            <div class="flex items-center gap-3"><i class="fa-solid fa-calculator w-5 text-[#176b5a]"></i><span class="flex-1 font-semibold">数学作业</span><button type="button" class="h-9 w-9 text-[#727a77]" aria-label="删除提醒"><i class="fa-regular fa-trash-can"></i></button></div>
            <div class="mt-3 flex items-center justify-between border-t border-[#edf0ef] pt-3"><span class="text-sm text-[#69716e]">开始时间</span><time class="text-lg font-bold text-[#176b5a]">18:20</time></div>
          </div>
          <div class="rounded-lg border border-[#dfe5e2] bg-white p-4">
            <div class="flex items-center gap-3"><i class="fa-solid fa-language w-5 text-[#176b5a]"></i><span class="flex-1 font-semibold">英语作业</span><button type="button" class="h-9 w-9 text-[#727a77]" aria-label="删除提醒"><i class="fa-regular fa-trash-can"></i></button></div>
            <div class="mt-3 flex items-center justify-between border-t border-[#edf0ef] pt-3"><span class="text-sm text-[#69716e]">开始时间</span><time class="text-lg font-bold text-[#176b5a]">19:10</time></div>
          </div>
        </div>
        <button type="button" class="mt-3 flex h-12 w-full items-center justify-center gap-2 rounded-lg border border-[#176b5a] bg-white font-bold text-[#176b5a]"><i class="fa-solid fa-plus"></i>添加提醒</button>
      </section>
    </form>
  </main>
</body>
</html>

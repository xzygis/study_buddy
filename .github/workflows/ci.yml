name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    name: iOS
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Xcode
        run: |
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | awk '/Xcode/ { split($2, version, "."); print version[1] }')
          test "$XCODE_MAJOR" -ge 26

      - name: Run core tests
        run: swift test --package-path ios

      - name: Build universal app for Simulator
        run: |
          xcodebuild \
            -project ios/StudyAlarm.xcodeproj \
            -scheme StudyAlarm \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test, lint and build APK
        run: ./gradlew :android:testDebugUnitTest :android:lintDebug :android:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: studybuddy-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
